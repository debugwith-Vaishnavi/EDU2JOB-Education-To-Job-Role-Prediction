<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Edu2Job — Predict</title>

  <style>
    body{
      font-family:Poppins,Inter;
      margin:0;
      background:linear-gradient(120deg,#0c1526,#15223a);
      color:#eaf4ff;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }

    /* NAVBAR */
    .navbar{
      position:fixed;
      top:0; left:0;
      width:100%;
      padding:16px 18px;
      background:rgba(255,255,255,0.06);
      backdrop-filter:blur(10px);
      display:flex;
      justify-content:space-between;
      align-items:center;
      box-shadow:0 4px 20px rgba(0,0,0,0.3);
    }
    .nav-links a{
      color:#9ac0ff;
      text-decoration:none;
      margin-right:20px;
      font-weight:600;
      transition:0.2s;
    }
    .nav-links a:hover{
      color:white;
    }

    .card{
      width:820px;
      padding:28px;
      margin-top:90px;
      border-radius:14px;
      background:rgba(255,255,255,0.06);
      backdrop-filter:blur(10px);
      box-shadow:0 12px 30px rgba(0,0,0,0.5);
    }
    label{
      display:block;
      margin-top:10px;
      font-weight:600;
    }
    input,select{
      width:100%;
      padding:10px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(255,255,255,0.08);
      color:#fff;
      outline:none;
    }

    /* 🔥 FIXED: Dropdown Options (NO WHITE BACKGROUND) */
    select option{
      background:#111827;   /* dark */
      color:#fff;           /* white text */
    }
    select option:hover{
      background:#1f2937;
      color:#fff;
    }

    .skill-chip{
      margin:6px;
      padding:8px 10px;
      border-radius:10px;
      background:#111827;
      color:#fff;
      border:none;
      cursor:pointer;
    }
    .skill-chip:hover{
      opacity:0.7;
    }
    .skill-tag{
      display:inline-block;
      background:#7a9dff;
      color:#000;
      padding:6px 10px;
      border-radius:12px;
      margin:6px;
      cursor:pointer;
      font-weight:700;
    }
    button.primary{
      margin-top:16px;
      padding:12px;
      border-radius:10px;
      border:none;
      background:linear-gradient(90deg,#7a9dff,#b07bff);
      color:#000;
      font-weight:800;
      cursor:pointer;
      width:100%;
    }
    
  </style>
</head>

<body>

  <div class="navbar">
    <div style="font-size:20px;font-weight:800;color:#9ac0ff;">
      Edu2Job
    </div>

    <div class="nav-links">
      <a href="/dashboard/">Home</a>
<a href="/profile/">Profile</a>
<a href="/predict/">Predict</a>
<a href="/history/">History</a>
<a href="/" onclick="logout()">Logout</a>
    </div>
  </div>

  <div class="card">

    <h2>Predict Your Job Role</h2>

    <div style="display:flex;gap:20px;margin-top:14px;">
      <div style="flex:1;">
        <label>CGPA</label>
        <input id="CGPA" type="number" step="0.01" placeholder="8.5">

        <label>Years of Experience</label>
        <input id="Years" type="number" step="0.1" placeholder="2">

        <label>Degree</label>
        <select id="Degree">
          <option value="">Select Degree</option>
          <option>M.Tech</option><option>B.E</option>
          <option>MCA</option><option>B.Sc</option>
        </select>

        <label>Major</label>
        <select id="Major">
          <option value="">Select Major</option>
          <option>Computer Science</option>
          <option>Information Technology</option>
          <option>Electronics</option>
          <option>AI & ML</option>
          <option>Data Science</option>
        </select>

        <label>Specialization</label>
        <select id="Specialization">
          <option value="">Select Specialization</option>
          <option>Frontend</option><option>Backend</option>
          <option>Full Stack</option><option>DevOps</option>
          <option>AI</option><option>ML</option><option>Cloud</option>
        </select>
      </div>

      <div style="flex:1;">
        <label>Certification</label>
        <select id="Certification">
          <option value="">Select Certification</option>
          <option>HackerRank SQL</option>
          <option>AWS</option><option>Azure</option>
          <option>Google Cloud</option>
          <option>Python Certification</option>
        </select>

        <label>Preferred Industry</label>
        <select id="PreferredIndustry">
          <option value="">Select Industry</option>
          <option>Product-based</option><option>Service-based</option>
          <option>Startup</option><option>Research</option>
        </select>

        <label style="margin-top:12px;">Skills</label>
        <div>
          <button class="skill-chip" data-skill="Python">Python</button>
          <button class="skill-chip" data-skill="Java">Java</button>
          <button class="skill-chip" data-skill="JavaScript">JavaScript</button>
          <button class="skill-chip" data-skill="React">React</button>
          <button class="skill-chip" data-skill="SQL">SQL</button>
          <button class="skill-chip" data-skill="Django">Django</button>
        </div>

        <div id="selectedSkills" style="margin-top:12px;"></div>

        <label style="margin-top:10px;">Custom skills</label>
        <input id="customSkills" placeholder="Flask, Docker">

        <button id="addCustom" class="primary" style="background:#111827;color:#fff;margin-top:10px;">
          Add custom skills
        </button>
      </div>
    </div>

    <button id="predictBtn" class="primary">Predict & Show Results</button>

  </div>

<script>
const API = "/api/";
const token =
  localStorage.getItem("token") ||
  localStorage.getItem("access") ||
  localStorage.getItem("access_token");
if(!token){
  alert("Login required");
  window.location.href="/";
}

function logout(){
  localStorage.clear();
  sessionStorage.clear();
  alert("Logged out");
}

function addSkill(skill){
  const box = document.getElementById('selectedSkills');
  const exists = Array.from(box.children).some(c=>c.innerText === skill);
  if(exists) return;
  const tag = document.createElement('div');
  tag.className = 'skill-tag';
  tag.innerText = skill;
  tag.title = "Click to remove";
  tag.onclick = ()=> tag.remove();
  box.appendChild(tag);
}

document.querySelectorAll('.skill-chip').forEach(btn=>{
  btn.addEventListener('click', ()=> addSkill(btn.dataset.skill));
});

document.getElementById('addCustom').addEventListener('click', ()=>{
  const v = document.getElementById('customSkills').value.trim();
  if(!v) return;
  v.split(',').map(s=>s.trim()).filter(Boolean).forEach(addSkill);
  document.getElementById('customSkills').value='';
});

document.getElementById('predictBtn').addEventListener('click', async ()=>{
  const skills = Array.from(document.getElementById('selectedSkills').children).map(n=>n.innerText);

  const payload = {
    "CGPA": parseFloat(document.getElementById('CGPA').value || 0),
    "Years of Experience": parseFloat(document.getElementById('Years').value || 0),
    "Degree": document.getElementById('Degree').value,
    "Major": document.getElementById('Major').value,
    "Specialization": document.getElementById('Specialization').value,
    "Certification": document.getElementById('Certification').value,
    "Preferred Industry": document.getElementById('PreferredIndustry').value,
    "Skills": skills.join(", ")
  };

  const btn = document.getElementById('predictBtn');
  btn.disabled = true;
  btn.innerText = "Predicting...";

  try{
    const res = await fetch(API + "predict/", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+token
      },
      body: JSON.stringify(payload)
    });

    const data = await res.json();
    if(!res.ok){
      alert("Error: " + (data.error || "Prediction failed"));
      btn.disabled = false;
      btn.innerText = "Predict & Show Results";
      return;
    }

    sessionStorage.setItem('edu2job_prediction', JSON.stringify(data));
    window.location.href="/result/";

  }catch(e){
    console.error(e);
    alert("Server error");
  }
});
</script>

</body>
</html>
